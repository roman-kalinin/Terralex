function ptInPoly(lat, lon, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const yi = poly[i][0], xi = poly[i][1];
    const yj = poly[j][0], xj = poly[j][1];
    if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

function isLand(lat, lon) {
  for (let i = 0; i < P.length; i++) {
    if (ptInPoly(lat, lon, P[i])) return true;
  }
  return false;
}

// ============================================================
// CANVAS
// ============================================================
const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;

let W, H, GLOBE_R, globeCX, globeCY;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Large globe, center at bottom, only top ~40% pokes up
  GLOBE_R = Math.max(W, H) * 0.7;
  globeCX = W / 2;
  globeCY = H + GLOBE_R * 0.5;
}
resize();

// ============================================================
// PROJECTION — tilted forward so top faces viewer, spins "away"
// ============================================================
const TILT = -0.5; // tilt forward

function latLonTo3D(lat, lon, r) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return [
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  ];
}

const cosT = Math.cos(TILT), sinT = Math.sin(TILT);

function transformFast(x, y, z, cosR, sinR) {
  // Y-rotate then X-tilt
  const rx = x * cosR + z * sinR;
  const ry = y;
  const rz = -x * sinR + z * cosR;
  return [rx, ry * cosT - rz * sinT, ry * sinT + rz * cosT];
}

// ============================================================
// PRECOMPUTE DOTS — dense
// ============================================================
const DOT_SPACING = 1.8;
let landPts = []; // [x,y,z] arrays
let oceanPts = [];

function precompute() {
  landPts = [];
  oceanPts = [];
  for (let lat = -90; lat <= 90; lat += DOT_SPACING) {
    const phi = lat * Math.PI / 180;
    const circ = Math.cos(phi);
    const lonStep = DOT_SPACING / Math.max(circ, 0.1);
    for (let lon = -180; lon < 180; lon += lonStep) {
      const p = latLonTo3D(lat, lon, GLOBE_R);
      if (isLand(lat, lon)) {
        landPts.push(p);
      }
    }
  }
  // Sparse ocean
  const OS = DOT_SPACING * 5;
  for (let lat = -90; lat <= 90; lat += OS) {
    const phi = lat * Math.PI / 180;
    const circ = Math.cos(phi);
    const lonStep = OS / Math.max(circ, 0.1);
    for (let lon = -180; lon < 180; lon += lonStep) {
      if (!isLand(lat, lon)) {
        oceanPts.push(latLonTo3D(lat, lon, GLOBE_R));
      }
    }
  }
}

// ============================================================
// STATE
// ============================================================
let rotation = 0;
const ROT_SPEED = 0.0005;
let hoveredFirm = null;
let lineAnim = 0;
let mouseX = -999, mouseY = -999;
let isDragging = false, dragStartX = 0, dragRot = 0;

// ============================================================
// DRAW
// ============================================================
function draw() {
  if (!isDragging) rotation -= ROT_SPEED;

  ctx.clearRect(0, 0, W, H);

  const cosR = Math.cos(rotation), sinR = Math.sin(rotation);

  // Clip to viewport bottom area
  const yLimit = H + 10;

  // --- Ocean dots ---
  for (let i = 0; i < oceanPts.length; i++) {
    const p = oceanPts[i];
    const t = transformFast(p[0], p[1], p[2], cosR, sinR);
    if (t[2] < 0) continue;
    const sx = globeCX + t[0];
    const sy = globeCY - t[1];
    if (sy > yLimit || sy < -10) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(sx - 0.4, sy - 0.4, 0.8, 0.8);
  }

  // --- Land dots ---
  const dotBase = Math.max(0.7, GLOBE_R / 700);
  for (let i = 0; i < landPts.length; i++) {
    const p = landPts[i];
    const t = transformFast(p[0], p[1], p[2], cosR, sinR);
    if (t[2] < 0) continue;
    const sx = globeCX + t[0];
    const sy = globeCY - t[1];
    if (sy > yLimit || sy < -10) continue;
    const depth = t[2] / GLOBE_R;
    const alpha = 0.15 + 0.75 * depth;
    const size = dotBase * (0.5 + 0.6 * depth);
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.beginPath();
    ctx.arc(sx, sy, size, 0, 6.283);
    ctx.fill();
  }

  // --- Firms ---
  const svgEl = document.getElementById('lines');
  svgEl.innerHTML = '';
  svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svgEl.style.width = W + 'px';
  svgEl.style.height = H + 'px';

  const tooltipEl = document.getElementById('tooltip');
  let foundHover = null;

  for (const f of firms) {
    const p = latLonTo3D(f.lat, f.lon, GLOBE_R);
    const t = transformFast(p[0], p[1], p[2], cosR, sinR);
    if (t[2] < 0) continue;
    const sx = globeCX + t[0];
    const sy = globeCY - t[1];
    if (sy > yLimit || sy < -10) continue;

    const depth = t[2] / GLOBE_R;
    const dx = mouseX - sx, dy = mouseY - sy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const isHov = dist < 24 && !isDragging;

    if (isHov) foundHover = { ...f, sx, sy };

    const dotR = isHov ? 5 : 2.8;
    const dotAlpha = isHov ? 0.9 : 0.3 + 0.5 * depth;

    // Glow
    const gR = isHov ? 20 : 8;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, gR);
    g.addColorStop(0, `rgba(0,0,0,${isHov ? 0.15 : 0.05})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, sy, gR, 0, 6.283);
    ctx.fill();

    ctx.fillStyle = `rgba(20,20,20,${dotAlpha})`;
    ctx.beginPath();
    ctx.arc(sx, sy, dotR, 0, 6.283);
    ctx.fill();

    if (isHov) {
      lineAnim = Math.min(lineAnim + 0.07, 1);
      const lineH = 70 * lineAnim;
      const topY = sy - lineH;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', sx);
      line.setAttribute('y1', sy);
      line.setAttribute('x2', sx);
      line.setAttribute('y2', topY);
      line.setAttribute('stroke', 'rgba(30,30,30,0.5)');
      line.setAttribute('stroke-width', '1');
      svgEl.appendChild(line);

      const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circ.setAttribute('cx', sx);
      circ.setAttribute('cy', topY);
      circ.setAttribute('r', 2.5 * lineAnim);
      circ.setAttribute('fill', '#1a1a1a');
      svgEl.appendChild(circ);

      tooltipEl.style.left = (sx + 14) + 'px';
      tooltipEl.style.top = (topY - 48) + 'px';
      tooltipEl.classList.add('visible');
      document.getElementById('tt-city').textContent = f.city;
      document.getElementById('tt-firm').textContent = f.firm;
      document.getElementById('tt-practice').textContent = f.practice;
    }
  }

  if (!foundHover) {
    lineAnim = 0;
    tooltipEl.classList.remove('visible');
  }
  hoveredFirm = foundHover;
  canvas.style.cursor = foundHover ? 'pointer' : 'default';

  requestAnimationFrame(draw);
}

window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  if (isDragging) {
    rotation = dragRot + (e.clientX - dragStartX) * 0.002;
  }
});

window.addEventListener('mousedown', (e) => {
  if (!hoveredFirm) {
    isDragging = true;
    dragStartX = e.clientX;
    dragRot = rotation;
    canvas.style.cursor = 'grabbing';
  }
});

window.addEventListener('mouseup', () => { isDragging = false; });

window.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  mouseX = t.clientX; mouseY = t.clientY;
  if (isDragging) rotation = dragRot + (t.clientX - dragStartX) * 0.002;
}, { passive: true });
window.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  mouseX = t.clientX; mouseY = t.clientY;
  isDragging = true; dragStartX = t.clientX; dragRot = rotation;
}, { passive: true });
window.addEventListener('touchend', () => { isDragging = false; }, { passive: true });

// ============================================================
// INIT
// ============================================================
window.addEventListener('resize', () => {
  resize();
  precompute();
});

precompute();
requestAnimationFrame(draw);
</script>
</body>
</html>
