<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globe Widget</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
}

#globeCanvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
#globeInteract {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  cursor: default;
}
.line-layer {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
.tooltip {
  position: absolute; pointer-events: none;
  opacity: 0; transition: opacity 0.2s ease; z-index: 20;
}
.tooltip.visible { opacity: 1; }
.tooltip-card {
  background: rgba(255,255,255,0.97);
  border: 1px solid rgba(0,0,0,0.09); border-radius: 4px;
  padding: 9px 13px; backdrop-filter: blur(12px);
  min-width: 160px; box-shadow: 0 4px 28px rgba(0,0,0,0.08);
  font-family: 'DM Sans', sans-serif;
}
.tooltip-city {
  font-family: 'Instrument Serif', serif;
  font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 2px;
}
.tooltip-firm  { font-size: 11px; color: #444; letter-spacing: 0.3px; }
.tooltip-practice { font-size: 10px; color: #999; margin-top: 3px; letter-spacing: 0.2px; }

#loading {
  position: absolute; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  color: #bbb; z-index: 100; transition: opacity 0.5s;
  font-family: sans-serif;
}
</style>
</head>
<body>

<canvas id="globeCanvas"></canvas>
<div id="globeInteract"></div>
<svg class="line-layer" id="lines"></svg>
<div class="tooltip" id="tooltip">
  <div class="tooltip-card">
    <div class="tooltip-city" id="tt-city"></div>
    <div class="tooltip-firm" id="tt-firm"></div>
    <div class="tooltip-practice" id="tt-practice"></div>
  </div>
</div>
<div id="loading">Loading globe…</div>

<script>
const firms = [
  { city: "New York",     firm: "Sullivan & Cromwell",  practice: "M&A · Capital Markets",   lat: 40.71, lon: -74.01 },
  { city: "London",       firm: "Slaughter and May",    practice: "Corporate · Finance",      lat: 51.51, lon: -0.13  },
  { city: "Frankfurt",    firm: "Hengeler Mueller",     practice: "Banking · Antitrust",      lat: 50.11, lon: 8.68   },
  { city: "São Paulo",    firm: "Machado Meyer",        practice: "Infrastructure · Tax",     lat: -23.55,lon: -46.63 },
  { city: "Tokyo",        firm: "Nishimura & Asahi",   practice: "IP · Corporate",           lat: 35.68, lon: 139.65 },
  { city: "Singapore",    firm: "Rajah & Tann",         practice: "Arbitration · Trade",      lat: 1.35,  lon: 103.82 },
  { city: "Sydney",       firm: "Clayton Utz",          practice: "Litigation · Energy",      lat: -33.87,lon: 151.21 },
  { city: "Paris",        firm: "Bredin Prat",          practice: "Competition · M&A",        lat: 48.86, lon: 2.35   },
  { city: "Dubai",        firm: "Al Tamimi & Co",       practice: "Construction · Banking",   lat: 25.20, lon: 55.27  },
  { city: "Mexico City",  firm: "Creel García-Cuéllar", practice: "Energy · Real Estate",     lat: 19.43, lon: -99.13 },
  { city: "Johannesburg", firm: "Webber Wentzel",       practice: "Mining · Finance",         lat: -26.20,lon: 28.05  },
  { city: "Mumbai",       firm: "AZB & Partners",       practice: "Private Equity · M&A",     lat: 19.08, lon: 72.88  },
  { city: "Toronto",      firm: "Stikeman Elliott",     practice: "Securities · Tax",         lat: 43.65, lon: -79.38 },
  { city: "Madrid",       firm: "Uría Menéndez",        practice: "EU Law · Banking",         lat: 40.42, lon: -3.70  },
  { city: "Hong Kong",    firm: "Deacons",              practice: "IP · Real Estate",         lat: 22.32, lon: 114.17 },
  { city: "Berlin",       firm: "Gleiss Lutz",          practice: "Employment · Public",      lat: 52.52, lon: 13.41  },
  { city: "Shanghai",     firm: "Fangda Partners",      practice: "Capital Markets · PE",     lat: 31.23, lon: 121.47 },
  { city: "Buenos Aires", firm: "Marval O'Farrell",     practice: "Energy · Arbitration",     lat: -34.60,lon: -58.38 },
  { city: "Lagos",        firm: "Templars",             practice: "Oil & Gas · Finance",      lat: 6.52,  lon: 3.38   },
  { city: "Seoul",        firm: "Kim & Chang",          practice: "Antitrust · IP",           lat: 37.57, lon: 126.98 },
];

const canvas = document.getElementById('globeCanvas');
const ctx    = canvas.getContext('2d');
const dpr    = window.devicePixelRatio || 1;
let W, H;

function resizeCanvas() {
  W = canvas.offsetWidth;
  H = canvas.offsetHeight;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();

const TILT = -0.42;
const cosT = Math.cos(TILT), sinT = Math.sin(TILT);
let GLOBE_R, globeCX, globeCY;

function updateGlobeDims() {
  GLOBE_R = Math.max(W, H) * 0.72;
  globeCX = W / 2;
  globeCY = H + GLOBE_R * 0.52;
}
updateGlobeDims();

function latLonTo3D(lat, lon, r) {
  const phi   = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return [
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  ];
}

function globeProject(x, y, z, cosR, sinR) {
  const rx = x * cosR + z * sinR;
  const ry = y;
  const rz = -x * sinR + z * cosR;
  return [
    globeCX + rx,
    globeCY - (ry * cosT - rz * sinT),
    ry * sinT + rz * cosT
  ];
}

let landMaskCtx = null;
const MASK_W = 720, MASK_H = 360;

function buildMask(rings) {
  const oc = document.createElement('canvas');
  oc.width = MASK_W; oc.height = MASK_H;
  const mc = oc.getContext('2d', { willReadFrequently: true });
  mc.fillStyle = '#000'; mc.fillRect(0, 0, MASK_W, MASK_H);
  mc.fillStyle = '#fff';
  for (const ring of rings) {
    if (ring.length < 3) continue;
    mc.beginPath();
    for (let i = 0; i < ring.length; i++) {
      const px = ((ring[i][0] + 180) / 360) * MASK_W;
      const py = ((90 - ring[i][1]) / 180) * MASK_H;
      i === 0 ? mc.moveTo(px, py) : mc.lineTo(px, py);
    }
    mc.closePath(); mc.fill();
  }
  landMaskCtx = mc;
}

function isLand(lat, lon) {
  if (!landMaskCtx) return false;
  const px = Math.max(0, Math.min(Math.floor(((lon + 180) / 360) * MASK_W), MASK_W - 1));
  const py = Math.max(0, Math.min(Math.floor(((90 - lat) / 180) * MASK_H), MASK_H - 1));
  return landMaskCtx.getImageData(px, py, 1, 1).data[0] > 128;
}

function topoRings(topo) {
  const arcs  = topo.arcs;
  const scale = topo.transform ? topo.transform.scale     : [1, 1];
  const trans = topo.transform ? topo.transform.translate : [0, 0];
  const dec   = arcs.map(arc => {
    let x = 0, y = 0;
    return arc.map(([dx, dy]) => { x += dx; y += dy; return [x*scale[0]+trans[0], y*scale[1]+trans[1]]; });
  });
  function stitch(ids) {
    const pts = [];
    for (const id of ids) {
      const ap = id >= 0 ? dec[id].slice() : dec[~id].slice().reverse();
      pts.push(...(pts.length === 0 ? ap : ap.slice(1)));
    }
    return pts;
  }
  const rings = [];
  function extract(geo) {
    if (!geo) return;
    if      (geo.type === 'Polygon')           for (const r of geo.arcs)        rings.push(stitch(r));
    else if (geo.type === 'MultiPolygon')      for (const p of geo.arcs) for (const r of p) rings.push(stitch(r));
    else if (geo.type === 'GeometryCollection') for (const g of geo.geometries) extract(g);
  }
  extract(topo.objects.land);
  return rings;
}

let gDots = [];

function precomputeGlobe() {
  gDots = [];
  const LS = 1.5;
  for (let lat = -90; lat <= 90; lat += LS) {
    const cl = Math.cos(lat * Math.PI / 180);
    const ls = LS / Math.max(cl, 0.08);
    for (let lon = -180; lon < 180; lon += ls) {
      if (!isLand(lat, lon)) continue;
      gDots.push({ p3: latLonTo3D(lat, lon, GLOBE_R), isOcean: false });
    }
  }
  const OS = 7.0;
  for (let lat = -90; lat <= 90; lat += OS) {
    const cl = Math.cos(lat * Math.PI / 180);
    const ls = OS / Math.max(cl, 0.08);
    for (let lon = -180; lon < 180; lon += ls) {
      if (!isLand(lat, lon)) gDots.push({ p3: latLonTo3D(lat, lon, GLOBE_R), isOcean: true });
    }
  }
}

let firmDots = [];
function buildFirmDots() {
  firmDots = firms.map(f => ({ f, p3: latLonTo3D(f.lat, f.lon, GLOBE_R) }));
}

let rotation = 0;
const ROT_SPEED = 0.0004;
let cosR = 1, sinR = 0;
let isDragging = false, dragStartX = 0, dragRot = 0;
let mouseX = -9999, mouseY = -9999;
let lineAnim = 0;
let hoveredDot = null;

const interactEl = document.getElementById('globeInteract');

window.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if (isDragging) rotation = dragRot + (e.clientX - dragStartX) * 0.002;
});
interactEl.addEventListener('mousedown', e => {
  if (!hoveredDot) { isDragging = true; dragStartX = e.clientX; dragRot = rotation; }
});
window.addEventListener('mouseup', () => { isDragging = false; });
interactEl.addEventListener('touchmove', e => {
  const t = e.touches[0]; mouseX = t.clientX; mouseY = t.clientY;
  if (isDragging) rotation = dragRot + (t.clientX - dragStartX) * 0.002;
}, { passive: true });
interactEl.addEventListener('touchstart', e => {
  const t = e.touches[0]; mouseX = t.clientX; mouseY = t.clientY;
  isDragging = true; dragStartX = t.clientX; dragRot = rotation;
}, { passive: true });
window.addEventListener('touchend', () => { isDragging = false; }, { passive: true });

function draw(ts) {
  const now = (ts || 0) * 0.001;
  if (!isDragging) rotation -= ROT_SPEED;
  ctx.clearRect(0, 0, W, H);
  cosR = Math.cos(rotation); sinR = Math.sin(rotation);

  const yMin = -20, yMax = H + 20;
  const dotBase = Math.max(0.7, GLOBE_R / 780);

  for (let i = 0; i < gDots.length; i++) {
    const d = gDots[i];
    const [px, py, depth3] = globeProject(d.p3[0], d.p3[1], d.p3[2], cosR, sinR);
    if (d.isOcean) {
      ctx.fillStyle = 'rgba(0,0,0,0.07)';
      ctx.fillRect(px - 0.5, py - 0.5, 1, 1);
      continue;
    }
    if (depth3 <= 0) continue;
    if (px < -10 || px > W + 10 || py < yMin || py > yMax) continue;
    const depthN = Math.max(0, Math.min(depth3 / GLOBE_R, 1));
    const alpha  = 0.35 + 0.55 * depthN;
    const size   = dotBase * (0.55 + 0.45 * depthN);
    ctx.fillStyle = `rgba(0,0,0,${alpha.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(px, py, size, 0, 6.2832); ctx.fill();
  }

  const svgEl     = document.getElementById('lines');
  const tooltipEl = document.getElementById('tooltip');
  svgEl.innerHTML = '';
  svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);

  let activeFirm = null;
  let bestFirmDist = 40;

  for (let fi = 0; fi < firmDots.length; fi++) {
    const { f, p3 } = firmDots[fi];
    const [sx, sy, tz] = globeProject(p3[0], p3[1], p3[2], cosR, sinR);
    if (tz < 0 || sy < yMin || sy > yMax) continue;
    const depth = Math.max(0, tz / GLOBE_R);
    const pulse  = 0.5 + 0.5 * Math.sin(now * 1.6 + fi * 1.1);
    const pSize  = dotBase * (1.2 + 0.9 * depth) * (1 + 0.6 * pulse);
    const pAlpha = Math.min((0.5 + 0.5 * depth) * (0.7 + 0.3 * pulse), 1);
    const glowR  = pSize * 3.5;
    const grd    = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
    grd.addColorStop(0, `rgba(0,0,0,${(0.14 * pulse).toFixed(3)})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(sx, sy, glowR, 0, 6.2832); ctx.fill();
    ctx.fillStyle = `rgba(10,10,10,${pAlpha.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(sx, sy, pSize, 0, 6.2832); ctx.fill();
    if (!isDragging) {
      const dx = mouseX - sx, dy = mouseY - sy;
      if (Math.sqrt(dx*dx + dy*dy) < bestFirmDist) { bestFirmDist = Math.sqrt(dx*dx+dy*dy); activeFirm = { f, sx, sy }; }
    }
  }

  if (activeFirm) {
    hoveredDot = activeFirm;
    lineAnim   = Math.min(lineAnim + 0.07, 1);
    const { sx, sy, f } = activeFirm;
    const topY = sy - 80 * lineAnim;
    ctx.fillStyle = 'rgba(0,0,0,0.95)';
    ctx.beginPath(); ctx.arc(sx, sy, dotBase * 2.2 + 2, 0, 6.2832); ctx.fill();
    const ln = document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1', sx); ln.setAttribute('y1', sy);
    ln.setAttribute('x2', sx); ln.setAttribute('y2', topY);
    ln.setAttribute('stroke','rgba(17,17,17,0.55)'); ln.setAttribute('stroke-width','1');
    svgEl.appendChild(ln);
    const ck = document.createElementNS('http://www.w3.org/2000/svg','circle');
    ck.setAttribute('cx', sx); ck.setAttribute('cy', topY);
    ck.setAttribute('r', 2.5 * lineAnim); ck.setAttribute('fill','#111');
    svgEl.appendChild(ck);
    const ttX = sx + 16 > W - 190 ? sx - 190 : sx + 16;
    tooltipEl.style.left = ttX + 'px';
    tooltipEl.style.top  = (topY - 52) + 'px';
    tooltipEl.classList.add('visible');
    document.getElementById('tt-city').textContent     = f.city;
    document.getElementById('tt-firm').textContent     = f.firm;
    document.getElementById('tt-practice').textContent = f.practice;
  } else {
    hoveredDot = null;
    lineAnim   = Math.max(lineAnim - 0.08, 0);
    if (lineAnim < 0.01) tooltipEl.classList.remove('visible');
  }

  interactEl.style.cursor = activeFirm ? 'pointer' : (isDragging ? 'grabbing' : 'default');
  requestAnimationFrame(draw);
}

window.addEventListener('resize', () => {
  resizeCanvas();
  updateGlobeDims();
  if (landMaskCtx) { precomputeGlobe(); buildFirmDots(); }
});

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')
  .then(r => r.json())
  .then(topo => {
    buildMask(topoRings(topo));
    precomputeGlobe();
    buildFirmDots();
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => document.getElementById('loading').style.display = 'none', 600);
    requestAnimationFrame(draw);
  })
  .catch(() => requestAnimationFrame(draw));
</script>
</body>
</html>
